gix-zlib = { git = "https://github.com/GitoxideLabs/gitoxide.git", rev = "c4426f034d5423c66cc5c15725587d9688deada3" }

[profile.release]
opt-level = 3
lto = "fat"
overflow-checks = false
debug = true
debug-assertions = false
codegen-units = 1
