[workspace]
resolver = "2"
members = ["gix-lib", "gix-py"]

[workspace.package]
repository = "https://gitlab.softwareheritage.org/swh/devel/swh-loader-git"
license = "GPL-3.0-or-later"
version = "0.1.0"

[workspace.dependencies]
pyo3 = { version = "0.25", features = ["abi3-py39", "extension-module"] }
swh-loader-git-gix = { path = "./gix-lib" }

# All gix-* crates patched to UPSTREAM GitoxideLabs/gitoxide, pinned to
# merge commit c4426f034d5423c66cc5c15725587d9688deada3 on `main`.
#
# This is the index-less parallel pack traversal we contributed and got
# merged as GitoxideLabs/gitoxide#2923 (2026-08-17): `pub mod
# cache::delta` + the public `Tree::from_offsets_in_pack`, which the
# direct-tree traversal in `gix-lib/src/traverse.rs` calls (cf. the
# `gix_pack::cache::delta::{Tree, traverse}` references).  We no longer
# maintain an SWH fork of gitoxide -- this consumes upstream unmodified.
#
# Why a git pin rather than crates.io: the merge is not yet in a
# published gix-pack release (latest is 0.73.0, 2026-07-23, predating
# the merge).  As soon as a release ships #2923, delete this entire
# [patch] section and rely on the crates.io versions already declared in
# gix-lib/Cargo.toml -- no source change is then required.
#
# Why ALL gix-* entries rather than just gix-pack: when cargo patches a
# single crate via git, that crate pulls its sibling deps from its own
# workspace, causing version drift against the rest of the graph.
# Patching the whole gix-* family at the same commit keeps cargo's
# resolver on a single coherent version set.
[patch.crates-io]
gix-pack = { git = "https://github.com/GitoxideLabs/gitoxide.git", rev = "c4426f034d5423c66cc5c15725587d9688deada3" }
gix-hash = { git = "https://github.com/GitoxideLabs/gitoxide.git", rev = "c4426f034d5423c66cc5c15725587d9688deada3" }
gix-object = { git = "https://github.com/GitoxideLabs/gitoxide.git", rev = "c4426f034d5423c66cc5c15725587d9688deada3" }
gix-features = { git = "https://github.com/GitoxideLabs/gitoxide.git", rev = "c4426f034d5423c66cc5c15725587d9688deada3" }
gix-chunk = { git = "https://github.com/GitoxideLabs/gitoxide.git", rev = "c4426f034d5423c66cc5c15725587d9688deada3" }
gix-error = { git = "https://github.com/GitoxideLabs/gitoxide.git", rev = "c4426f034d5423c66cc5c15725587d9688deada3" }
gix-path = { git = "https://github.com/GitoxideLabs/gitoxide.git", rev = "c4426f034d5423c66cc5c15725587d9688deada3" }
gix-hashtable = { git = "https://github.com/GitoxideLabs/gitoxide.git", rev = "c4426f034d5423c66cc5c15725587d9688deada3" }
gix-tempfile = { git = "https://github.com/GitoxideLabs/gitoxide.git", rev = "c4426f034d5423c66cc5c15725587d9688deada3" }
gix-actor = { git = "https://github.com/GitoxideLabs/gitoxide.git", rev = "c4426f034d5423c66cc5c15725587d9688deada3" }
gix-date = { git = "https://github.com/GitoxideLabs/gitoxide.git", rev = "c4426f034d5423c66cc5c15725587d9688deada3" }
gix-validate = { git = "https://github.com/GitoxideLabs/gitoxide.git", rev = "c4426f034d5423c66cc5c15725587d9688deada3" }
gix-utils = { git = "https://github.com/GitoxideLabs/gitoxide.git", rev = "c4426f034d5423c66cc5c15725587d9688deada3" }
gix-trace = { git = "https://github.com/GitoxideLabs/gitoxide.git", rev = "c4426f034d5423c66cc5c15725587d9688deada3" }
gix-fs = { git = "https://github.com/GitoxideLabs/gitoxide.git", rev = "c4426f034d5423c66cc5c15725587d9688deada3" }
